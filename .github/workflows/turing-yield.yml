name: Turing yield boundaries
on:
  # Retired from pull requests and pushes on 2026-10-16 (ADR 0033 Decision 11, phase 3): the Spark
  # runs these gates (tests/gates/) and the required AIEN Verification check verifies its signed
  # bundle. Kept as a manual trigger so a hosted run is still possible when needed.
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  portable-boundaries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Math, attribution and hostile fixtures with sanitizers
        run: make test-turing-yield test-turing-energy
