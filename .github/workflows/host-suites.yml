name: Host suites

# Host-runnable suites that rx-host.yml does not run, each triggered by its own
# files. All jobs run on the AArch64 hosted runner (same instruction set as the
# DGX Spark; searchtrace executes generated AArch64 code). The runner is NOT the
# Spark: nothing here is a chip or hardware qualification.
#
# Coverage map of `make test-*` targets (Lane 20 audit, 2026-10-01):
#   rx-host.yml host-reference : r3 r7 r8 r9 r12 action-graph state-projection
#       capability-query capability-graph skillroute-compose semantic-comm
#       cognitive-routing sem-incremental cortex jspace-prod composition
#       composition-attach-asan composition-gate fabric fabric-living
#       machine-identity effect-cap64 workflow-fusion typed-results costmodel
#   rx-host.yml omega-faculty-arm : program-id program-realize r10 r11
#       empirical (EMPIRICAL_ALLOW_NO_WIN=1: single-core runner) plan-reuse
#       (+ builds only of the R13/R14 living hosts; R16-G3 checks 1-3 on the
#       host and silicon builds: test-r16-authpath-linkmap{,-silicon})
#   rx-host.yml chip-only-declared : prints SKIP for every Spark/chip-only run
#   turing-yield.yml : turing-yield turing-energy
#   host-suites-3.yml : numeric-transc numeric-transc-digest language test-m6..m15
#       (test-numeric-transc-full and test-m17 are listed there as skipped jobs;
#       test-tensor and test-m16 have no Makefile target on main: NOT wired)
#   this file : searchtrace, estimation est-tools estimation-v3 est3c-tools,
#       ans (test-inertial-alignment: ANS Inertial Alignment v1, ARCH-0032),
#       numeric-cpu numeric-qualify, train (M22 substrate, Lane 21),
#       compiler (OSC-1, own path guard),
#       one-layer-acceptance (test-one-layer-acceptance: stage-1 harness
#       selftest on the public sample corpus; omega #443),
#       exp445-tools (test-omega-emit test-exp445: stage-2 driver, scorer and
#       mutants on dev tasks with a fake server; omega #445),
#       chip-tool-selftests (test-m19r-qualify test-gate14-combine
#       test-window-lane-guard test-unwritten-trap-host test-ldst-host: the
#       host-only self-tests of chip tooling; omega #425)
#
# Deliberately NOT on GitHub (no GB10, no resident seat, no quiet flag here):
#   test-composition-gate-gpu, test-r12-silicon, test-r13-silicon,
#   test-r14-silicon, test-r15-parity-silicon, test-r16-authpath-silicon,
#   test-m5, test-m16..test-m19 (chip milestones; test-m17 is a skipped job in
#   host-suites-3.yml), test-r13-host / test-r14-host
#   (need both GB10 core classes; rx-host builds them only).
# Not yet wired (host-only, follow-up): test-numeric-sweep,
#   test-numeric-e1-exhaustive (2^32 inputs per op, too long), visor-*,
#   turing-* other than yield/energy, polyglot*, algebra, realize, phase-twin,
#   ma-digital-bottom, path, crumbline, brownian-tps, argus-runtime,
#   branch-reuse, r15-*-host, r16-inventory/negative/surface.

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'Makefile'
      - '.github/workflows/host-suites.yml'
      - 'src/sha256.*'
      # searchtrace (links the Omega core and realization)
      - 'src/searchtrace/**'
      - 'tests/searchtrace/**'
      - 'mk/searchtrace.mk'
      - 'src/omega_*'
      - 'src/aarch64_*'
      # estimation
      - 'src/estimation/**'
      - 'tests/estimation/**'
      - 'tools/estimation/**'
      - 'mk/estimation*.mk'
      # ans (Inertial Alignment v1, ARCH-0032)
      - 'src/ans/**'
      - 'tests/ans/**'
      - 'mk/ans.mk'
      - 'docs/ans/**'
      - 'docs/estimation/EST3C_PROTOCOL_V3.md'
      - 'docs/estimation/receipts/est3c-v3/**'
      - 'evidence/R15/raw/**'
      # numeric (Gate 5 CPU tier)
      - 'tests/test_omega_numeric.c'
      - 'tests/numeric_oracle.h'
      - 'tests/run_numeric_gates.sh'
      - 'tools/test_numeric_qualify.sh'
      - 'tools/numeric_*'
      - 'tools/m19r_qualify.sh'
      - 'tools/m19r_campaign.sh'
      - 'tools/chipwait_campaign.sh'
      - 'tools/test_chipwait_campaign.sh'
      - 'tools/json_canon.c'
      - 'tools/e1_*'
      # chip-tool-selftests (host-only self-tests of chip tooling, omega #425)
      - 'tools/gate14_combine.sh'
      - 'tools/test_gate14_combine.sh'
      - 'tools/window_lane_guard.sh'
      - 'tests/window_lane_guard_test.sh'
      - 'tests/test_omega_unwritten_trap.c'
      - 'tests/test_omega_ldst_gb10.c'
      # train (M22 optimizer substrate + E5 provenance)
      - 'src/train/**'
      - 'tests/train/**'
      - 'mk/train.mk'
      # OSC-1 compiler slice + OSC-0B model (compiler job only; see its guard step;
      # the job also runs on src/aarch64_* changes, already listed above: OSC-2 item 4)
      - 'src/compiler/**'
      - 'tests/compiler/**'
      - 'mk/compiler.mk'
      # checker2 + signed realization receipts (one-layer stage 3, omega#446); its differential
      # and LRAT gate also run when the compiler, sha256 or the vendored Ed25519 change
      - 'src/checker2/**'
      - 'tests/checker2/**'
      - 'mk/checker2.mk'
      - 'spec/one-layer-receipts.md'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checker2:
    # Independent checker2 (src/checker2), LRAT gate and receipts (spec/one-layer-receipts.md):
    # plain + ASan/UBSan unit tests, black-box differential against oscc, 20-program LRAT gate,
    # receipt signature tests, and the GUARD-line mutant negative controls.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Changed-path guard (checker2 inputs only)
        id: guard
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then echo "run=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          CHANGED=$(git diff --name-only HEAD^1 HEAD)
          if echo "$CHANGED" | grep -Eq '^(src/checker2/|tests/checker2/|mk/checker2\.mk$|spec/one-layer-receipts\.md$|src/compiler/|tests/compiler/|mk/compiler\.mk$|src/sha256\.|src/searchtrace/sig/|\.github/workflows/host-suites\.yml$)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"; echo "no checker2 inputs changed; skipping"
          fi
      - name: checker2 unit, differential, LRAT gate, receipts, mutants (plain + ASan/UBSan)
        if: steps.guard.outputs.run == 'true'
        run: make PHYSICS_DIR=/nonexistent PHYSICS_LOCK_CHECK=0 test-checker2

  searchtrace:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Search-trace corpus, G3 holdout format and signature (M23), plain + ASan/UBSan
        run: make PHYSICS_DIR=/nonexistent PHYSICS_LOCK_CHECK=0 test-searchtrace

  estimation:
    name: estimation (${{ matrix.name }})
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: EST-0/EST-1 types, filter, reference (plain + ASan/UBSan, purity)
            target: test-estimation
          - name: EST-2/EST-3 replay, fit and evaluation tools (synthetic + run A data)
            target: test-est-tools
          - name: ESTIMATION-2 v3 predictive layer
            target: test-estimation-v3
          - name: EST-3c v3 tools (synthetic data; no sealed run)
            target: test-est3c-tools
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: ${{ matrix.name }}
        run: make PHYSICS_DIR=/nonexistent PHYSICS_LOCK_CHECK=0 ${{ matrix.target }}

  ans:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: ANS Inertial Alignment v1 (plain + ASan/UBSan, purity)
        run: make PHYSICS_DIR=/nonexistent PHYSICS_LOCK_CHECK=0 test-inertial-alignment

  numeric-cpu:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Gate 5 CPU tier (only the declared chip-only IDs may SKIP)
        run: make PHYSICS_DIR=/nonexistent PHYSICS_LOCK_CHECK=0 test-numeric-cpu
      - name: Gate 5 qualifier and receipt writer (host-only, fake descriptors)
        run: make PHYSICS_DIR=/nonexistent PHYSICS_LOCK_CHECK=0 test-numeric-qualify
      - name: E1 closure combiner (host-only, synthetic constituents, every hostile mutant refused)
        run: make PHYSICS_DIR=/nonexistent PHYSICS_LOCK_CHECK=0 test-e1-combine
      - name: Chipwait campaign runner (host-only, stub qualifier, no GPU)
        run: make PHYSICS_DIR=/nonexistent PHYSICS_LOCK_CHECK=0 test-chipwait-campaign
      - name: GPU completion wait primitive (host-only, fake memory and clock, mutants must die)
        run: make PHYSICS_DIR=/nonexistent PHYSICS_LOCK_CHECK=0 test-gpu-wait
      - name: GPU completion wait real-code mutants (each flagged build of the real code must fail)
        run: make PHYSICS_DIR=/nonexistent PHYSICS_LOCK_CHECK=0 test-gpu-wait-mutants
      - name: GPU code buffer prefetch tail (host-only, NO_TAIL mutant must die, source scan)
        run: make PHYSICS_DIR=/nonexistent PHYSICS_LOCK_CHECK=0 test-gpu-code-alloc

  train:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: M22 substrate (generation store, crash matrix, provenance, SGD), plain + ASan/UBSan
        run: make PHYSICS_DIR=/nonexistent PHYSICS_LOCK_CHECK=0 test-train

  compiler:
    # OSC-1 compiler slice (docs/osc/OSC-1-DESIGN.md) and the OSC-0B II.11 model.
    # Runs only when its own files (or this workflow / the shared sha256) change.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Changed-path guard (compiler files only)
        id: guard
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then echo "run=true" >> "$GITHUB_OUTPUT"; echo "full=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          CHANGED=$(git diff --name-only HEAD^1 HEAD)
          if echo "$CHANGED" | grep -Eq '^(src/compiler/|tests/compiler/|mk/compiler\.mk$|src/sha256\.|src/aarch64_|\.github/workflows/host-suites\.yml$)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"; echo "no OSC compiler files changed; skipping"
          fi
          # OSC-3 item 1: the full suite runs when the compiler or the legacy writer itself changes
          if echo "$CHANGED" | grep -Eq '^(src/compiler/|src/aarch64_)'; then
            echo "full=true" >> "$GITHUB_OUTPUT"
          else
            echo "full=false" >> "$GITHUB_OUTPUT"
          fi
      - name: OSC compiler quick suite (every compiler-path change; smoke counts, < 60 s)
        if: steps.guard.outputs.run == 'true'
        run: make PHYSICS_DIR=/nonexistent PHYSICS_LOCK_CHECK=0 test-compiler-quick
      - name: OSC-0B model sweep, back end, compiler golden/negative/model agreement, determinism, legacy writer (full, plain + ASan/UBSan)
        if: steps.guard.outputs.run == 'true' && steps.guard.outputs.full == 'true'
        run: make PHYSICS_DIR=/nonexistent PHYSICS_LOCK_CHECK=0 test-compiler-full

  physics0:
    # PD-0 hidden-equation benchmark substrate (docs/physics0/README.md): G0 self-test,
    # G5 isolation, G1 oracle calibration, mutant check, Omega-language differential.
    # Runs only when its own files (or this workflow / the shared sha256 / the OSC
    # compiler the differential test links) change.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Changed-path guard (physics0 files only)
        id: guard
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then echo "run=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          CHANGED=$(git diff --name-only HEAD^1 HEAD)
          if echo "$CHANGED" | grep -Eq '^(src/physics0/|tests/physics0/|mk/physics0\.mk$|src/compiler/|src/sha256\.|src/turing/history_selector\.c$|\.github/workflows/host-suites\.yml$)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"; echo "no physics0 files changed; skipping"
          fi
      - name: PD-0 substrate gates (plain + ASan/UBSan; V3 breach rates are recorded, not gated)
        if: steps.guard.outputs.run == 'true'
        run: make PHYSICS_DIR=/nonexistent PHYSICS_LOCK_CHECK=0 physics0-test

  one-layer-acceptance:
    # One-layer stage 1 hostile acceptance harness (omega#443): selftest on the PUBLIC sample
    # corpus (verdicts, receipts, isolation probes with negative controls, replays, mutants).
    # Needs Landlock + seccomp on the runner kernel; the harness fails closed without them.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Changed-path guard (one-layer acceptance files only)
        id: guard
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then echo "run=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          CHANGED=$(git diff --name-only HEAD^1 HEAD)
          if echo "$CHANGED" | grep -Eq '^(tests/one_layer/|mk/one-layer-acceptance\.mk$|evidence/ONE-LAYER-1/|src/compiler/|src/omega_program|src/omega_exec|src/omega_realize|src/aarch64_|src/sha256\.|\.github/workflows/host-suites\.yml$)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"; echo "no one-layer acceptance files changed; skipping"
          fi
      - name: Kernel sandbox support (Landlock in the LSM list)
        if: steps.guard.outputs.run == 'true'
        run: cat /sys/kernel/security/lsm || true
      - name: Stage-1 acceptance harness selftest (sample corpus)
        if: steps.guard.outputs.run == 'true'
        run: make PHYSICS_DIR=/nonexistent PHYSICS_LOCK_CHECK=0 test-one-layer-acceptance

  exp445-tools:
    # One-layer stage 2 (omega#445): omega_emit and the exp445 experiment driver, scorer and their
    # mutants, against a fake local server on dev tasks only (no model, no GPU, no held-out data).
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Changed-path guard (stage-2 tools only)
        id: guard
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then echo "run=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          CHANGED=$(git diff --name-only HEAD^1 HEAD)
          if echo "$CHANGED" | grep -Eq '^(tools/omega_emit/|tools/exp445/|tools/omegese/|mk/omega-emit\.mk$|mk/omegese\.mk$|mk/one-layer-acceptance\.mk$|tests/one_layer/|docs/one_layer/EXP445_PROTOCOL\.md$|src/compiler/|src/checker2/|src/sha256\.|\.github/workflows/host-suites\.yml$)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"; echo "no stage-2 tool files changed; skipping"
          fi
      - name: Tools the driver needs (jq, curl, flock)
        if: steps.guard.outputs.run == 'true'
        run: command -v jq && command -v curl && command -v flock
      - name: omega_emit and exp445 driver self-tests (dev tasks, fake server)
        if: steps.guard.outputs.run == 'true'
        run: make PHYSICS_DIR=/nonexistent PHYSICS_LOCK_CHECK=0 test-omega-emit test-exp445

  chip-tool-selftests:
    # Host-only self-tests of chip tooling that previously ran nowhere in CI
    # (omega #425): stub qualifier, synthetic receipts, CPU references. No GPU.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: M19R qualifier (candidate binding, immutable emission, stubbed qualification)
        run: make PHYSICS_DIR=/nonexistent PHYSICS_LOCK_CHECK=0 test-m19r-qualify
      - name: Gate 14 combiner (host-only, hostile inputs refused)
        run: make PHYSICS_DIR=/nonexistent PHYSICS_LOCK_CHECK=0 test-gate14-combine
      - name: Window lane guard (an unarchived receipt blocks the next lane)
        run: make PHYSICS_DIR=/nonexistent PHYSICS_LOCK_CHECK=0 test-window-lane-guard
      - name: Unwritten-register trap (host-only)
        run: make PHYSICS_DIR=/nonexistent PHYSICS_LOCK_CHECK=0 test-unwritten-trap-host
      - name: E1 row 2 global load/store tables (host-only, no device)
        run: make PHYSICS_DIR=/nonexistent PHYSICS_LOCK_CHECK=0 test-ldst-host
