name: Resident Reaction Host

on:
  pull_request:
    paths:
      - 'src/runtime/**'
      - 'tests/runtime/**'
      - 'Makefile'
      - '.github/workflows/rx-host.yml'
  push:
    branches:
      - 'feat/rx-*'
    paths:
      - 'src/runtime/**'
      - 'tests/runtime/**'
      - 'Makefile'
      - '.github/workflows/rx-host.yml'

jobs:
  host-reference:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Checkout pinned Physics headers
        uses: actions/checkout@v4
        with:
          repository: aien-dev/physics
          ref: 29bf6ea84ba19eb2b8612843ec9dd868a647f9bc
          path: physics-src
      - name: Build and run resident reaction host qualification
        env:
          OMEGA_CANDIDATE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
          PHYSICS_DIR: ${{ github.workspace }}/physics-src
        run: make test-r3
