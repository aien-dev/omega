name: Resident Reaction Host

on:
  pull_request:
    paths:
      - 'src/runtime/**'
      - 'tests/runtime/**'
      - 'Makefile'
      - 'src/omega_matvec_quad.*'
      - 'src/omega_types.h'
      - 'src/omega_core.*'
      - 'src/omega_canonical.*'
      - 'src/omega_codec.*'
      - 'src/omega_validate.*'
      - 'src/visor/visor_effect_request.*'
      - 'tests/effect/**'
      - 'src/omega_program.*'
      - 'src/omega_library.*'
      - 'src/omega_discovery.*'
      - 'src/language/**'
      - 'tests/program/**'
      - 'mk/program-id.mk'
      - '.github/workflows/rx-host.yml'
      - 'aienos.lock'
      - 'argus.lock'
  push:
    branches:
      - 'feat/rx-*'
    paths:
      - 'src/runtime/**'
      - 'tests/runtime/**'
      - 'Makefile'
      - 'src/omega_matvec_quad.*'
      - 'src/omega_types.h'
      - 'src/omega_core.*'
      - 'src/omega_canonical.*'
      - 'src/omega_codec.*'
      - 'src/omega_validate.*'
      - 'src/visor/visor_effect_request.*'
      - 'tests/effect/**'
      - 'src/omega_program.*'
      - 'src/omega_library.*'
      - 'src/omega_discovery.*'
      - 'src/language/**'
      - 'tests/program/**'
      - 'mk/program-id.mk'
      - '.github/workflows/rx-host.yml'
      - 'aienos.lock'
      - 'argus.lock'

jobs:
  host-reference:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Checkout pinned Physics headers
        uses: actions/checkout@v4
        with:
          repository: aien-dev/physics
          ref: fecbedb1b9cea9e4de0fa3c88fe795934fb361f9
          path: physics-src
      - name: Keep Physics checkout out of Omega tree status
        run: echo 'physics-src/' >> .git/info/exclude
      - name: Read pinned AIENOS authority
        id: aienos
        run: |
          sha=$(awk 'NF && $1 !~ /^#/ {print $1; exit}' aienos.lock)
          test -n "$sha"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - name: Checkout pinned AIENOS authority
        uses: actions/checkout@v4
        with:
          repository: aien-dev/aienos
          ref: ${{ steps.aienos.outputs.sha }}
          path: aienos-src
      - name: Keep AIENOS checkout out of Omega tree status
        run: echo 'aienos-src/' >> .git/info/exclude
      - name: Build and run resident reaction host qualification
        env:
          OMEGA_CANDIDATE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
          PHYSICS_COMMIT: fecbedb1b9cea9e4de0fa3c88fe795934fb361f9
          PHYSICS_DIR: ${{ github.workspace }}/physics-src
          AIENOS_R7_DIR: ${{ github.workspace }}/aienos-src
          AIENOS_COMMIT: ${{ steps.aienos.outputs.sha }}
        run: make test-r3 test-r7 test-r8 test-r9 test-r12 test-action-graph test-state-projection test-capability-query test-semantic-comm test-cognitive-routing test-sem-incremental
      - name: Effect capability generations are 64-bit end to end (OMEGA_EFFECT_CAP64)
        env:
          PHYSICS_DIR: ${{ github.workspace }}/physics-src
          AIENOS_R7_DIR: ${{ github.workspace }}/aienos-src
        run: |
          mkdir -p build
          make test-effect-cap64 | tee build/effect-cap64.log
          grep -q '^OMEGA_EFFECT_CAP64_PASS$' build/effect-cap64.log
      - name: Show state projection receipt
        run: |
          receipt="$(find build/qual-runs -name omega_state_projection_receipt.json -type f | head -n 1)"
          test -n "$receipt"
          grep -q '"failures": 0,' "$receipt"
          grep -q '"candidate_bound": true,' "$receipt"
          grep -q '"OMEGA_STATE_PROJECTION_PASS": "PASS"' "$receipt"
          sha256sum "$receipt"
          cat "$receipt"
      - name: Show action graph receipt
        run: |
          receipt="$(find build/qual-runs -name rx_action_graph_receipt.json -type f | head -n 1)"
          test -n "$receipt"
          grep -q '"failures": 0,' "$receipt"
          grep -q '"candidate_bound": true,' "$receipt"
          grep -q '"OMEGA_ACTION_GRAPH_IR_PASS": "PASS"' "$receipt"
          sha256sum "$receipt"
          cat "$receipt"
      - name: Check incremental semantics receipt
        run: |
          receipt="$(find build/qual-runs -name omega_incremental_semantics_receipt.json -type f | head -n 1)"
          test -n "$receipt"
          grep -q '"OMEGA_INCREMENTAL_SEMANTICS_PASS": "HOST_PASS_ENERGY_UNMEASURED"' "$receipt"
          grep -q '"false_hits": 0,' "$receipt"
      - name: Show capability query receipt
        run: |
          receipt="$(find build/qual-runs -name rx_capability_query_receipt.json -type f | head -n 1)"
          test -n "$receipt"
          grep -q '"failures": 0,' "$receipt"
          grep -q '"candidate_bound": true,' "$receipt"
          grep -q '"OMEGA_CAPABILITY_QUERY_PASS": "PASS"' "$receipt"
          sha256sum "$receipt"
          cat "$receipt"
      - name: Show semantic communication receipt
        run: |
          receipt="$(find build/qual-runs -name rx_semantic_comm_receipt.json -type f | head -n 1)"
          test -n "$receipt"
          grep -q '"failures": 0,' "$receipt"
          grep -q '"candidate_bound": true,' "$receipt"
          grep -q '"OMEGA_SEMANTIC_COMMUNICATION_PASS": "PASS"' "$receipt"
          sha256sum "$receipt"
          cat "$receipt"
      - name: Show cognitive routing receipt
        run: |
          receipt="$(find build/qual-runs -name rx_cognitive_routing_receipt.json -type f | head -n 1)"
          test -n "$receipt"
          grep -q '"failures": 0,' "$receipt"
          grep -q '"candidate_bound": true,' "$receipt"
          grep -q '"OMEGA_COGNITIVE_ROUTING_PASS": "PASS"' "$receipt"
      - name: Build and run workflow fusion qualification
        env:
          OMEGA_CANDIDATE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
          PHYSICS_COMMIT: fecbedb1b9cea9e4de0fa3c88fe795934fb361f9
          PHYSICS_DIR: ${{ github.workspace }}/physics-src
          AIENOS_R7_DIR: ${{ github.workspace }}/aienos-src
          AIENOS_COMMIT: ${{ steps.aienos.outputs.sha }}
        run: make test-workflow-fusion
      - name: Show workflow fusion receipt
        run: |
          receipt="$(find build/qual-runs -name rx_workflow_fusion_receipt.json -type f | head -n 1)"
          test -n "$receipt"
          grep -q '"failures": 0,' "$receipt"
          grep -q '"candidate_bound": true,' "$receipt"
          grep -q '"OMEGA_WORKFLOW_FUSION_PASS": "PASS"' "$receipt"
          sha256sum "$receipt"
          cat "$receipt"
      - name: Build and run typed result constraints
        env:
          OMEGA_CANDIDATE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
          PHYSICS_COMMIT: fecbedb1b9cea9e4de0fa3c88fe795934fb361f9
          PHYSICS_DIR: ${{ github.workspace }}/physics-src
          AIENOS_R7_DIR: ${{ github.workspace }}/aienos-src
          AIENOS_COMMIT: ${{ steps.aienos.outputs.sha }}
        run: make test-typed-results
      - name: Show typed result constraints receipt
        run: |
          receipt="$(find build/qual-runs -name rx_typed_results_receipt.json -type f | head -n 1)"
          test -n "$receipt"
          grep -q '"failures": 0,' "$receipt"
          grep -q '"candidate_bound": true,' "$receipt"
          grep -q '"OMEGA_TYPED_RESULT_CONSTRAINTS_PASS": "PASS"' "$receipt"
          sha256sum "$receipt"
          cat "$receipt"
      - name: Show R8 receipt
        run: |
          receipt="$(find build/qual-runs -name rx_aegis_resident_receipt.json -type f | head -n 1)"
          test -n "$receipt"
          grep -q '"failures": 0,' "$receipt"
          grep -q '"candidate_bound": true,' "$receipt"
          grep -q '"R8_CONSTITUTIONAL_AEGIS": "PASS"' "$receipt"
          sha256sum "$receipt"
          cat "$receipt"
      - name: Emit qualification receipt
        env:
          OMEGA_CANDIDATE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
          PHYSICS_COMMIT: fecbedb1b9cea9e4de0fa3c88fe795934fb361f9
        run: |
          receipt="$(find build/qual-runs -name rx_heartbeat_receipt.json -type f | head -n 1)"
          native="$(find build/qual-runs -name rx_native_authority_receipt.json -type f | head -n 1)"
          generation="$(find build/qual-runs -name rx_generation_barrier_receipt.json -type f | head -n 1)"
          test -n "$receipt"
          test -n "$native"
          test -n "$generation"
          echo "candidate commit: ${OMEGA_CANDIDATE_COMMIT}"
          echo "physics commit: ${PHYSICS_COMMIT}"
          if git diff --quiet && git diff --cached --quiet; then
            echo "tree cleanliness: clean"
          else
            echo "tree cleanliness: dirty"
          fi
          python3 - "$receipt" <<'PY'
          import hashlib, json, sys
          path = sys.argv[1]
          raw = open(path, "rb").read()
          doc = json.loads(raw)
          print("test totals: tests=%s passed=%s checks=%s failures=%s" % (
              doc["totals"]["tests"], doc["totals"]["tests_passed"],
              doc["totals"]["checks"], doc["totals"]["failures"]))
          print("receipt: %s" % path)
          print("receipt hash: %s" % hashlib.sha256(raw).hexdigest())
          gates = doc["gates"]
          for name in ("R1_CANONICAL_SHARED_WORLD_PASS", "R2_CROSS_ENGINE_ABI_PASS",
                       "R3_REACTION_CORE", "R4_CAUSAL_TRACE",
                       "R5_RESOURCE_ARBITRATION", "R6_REACTION_STABILITY"):
              print("gate %s: %s" % (name, gates.get(name, "missing")))
          print("not-claimed gates: %s" % ", ".join(gates.get("not_claimed", [])))
          print("hardware scope: %s" % doc.get("hardware_scope"))
          PY
          python3 - "$native" "$OMEGA_CANDIDATE_COMMIT" <<'PY'
          import hashlib, json, sys
          path, candidate = sys.argv[1], sys.argv[2]
          raw = open(path, "rb").read()
          doc = json.loads(raw)
          print("native receipt: %s" % path)
          print("native receipt hash: %s" % hashlib.sha256(raw).hexdigest())
          print("native candidate: %s" % doc.get("candidate_commit"))
          print("native candidate bound: %s" % doc.get("candidate_bound"))
          print("native tree dirty: %s" % doc.get("tree_dirty"))
          print("native aienos: %s" % doc.get("aienos_commit"))
          print("native gate: %s" % doc["gates"].get("R7_NATIVE_AUTHORITY"))
          diffs = doc.get("differential", [])
          print("native differential rows: %s" % len(diffs))
          mismatched = [row for row in diffs if row.get("linux") != row.get("native")]
          if doc.get("candidate_commit") != candidate or doc.get("candidate_bound") is not True:
              raise SystemExit("native receipt is not bound to this candidate")
          if doc.get("tree_dirty") is not False:
              raise SystemExit("native receipt was produced from a dirty tree")
          if mismatched or not diffs:
              raise SystemExit("native differential is empty or mismatched")
          PY
          python3 - "$generation" "$OMEGA_CANDIDATE_COMMIT" <<'PY'
          import json, sys
          path, candidate = sys.argv[1], sys.argv[2]
          doc = json.loads(open(path, "rb").read())
          print("generation receipt: %s" % path)
          print("generation candidate bound: %s" % doc.get("candidate_bound"))
          print("generation gate: %s" % doc["gates"].get("R9_GENERATION_BARRIER"))
          crashes = doc.get("crashes", [])
          print("generation crash rows: %s" % len(crashes))
          lineages = sorted({row.get("lineage") for row in crashes})
          if doc.get("candidate_commit") != candidate or doc.get("candidate_bound") is not True:
              raise SystemExit("generation receipt is not bound to this candidate")
          if doc.get("tree_dirty") is not False or doc.get("failures") != 0:
              raise SystemExit("generation receipt was not a clean passing run")
          diffs = doc.get("differential", [])
          if not diffs or any(row.get("linux") != row.get("native") for row in diffs):
              raise SystemExit("generation differential is empty or mismatched")
          if len(crashes) < 8 or lineages != [1, 2]:
              raise SystemExit("generation crash recoveries did not cover both generations")
          if any(not row.get("coherent") for row in crashes):
              raise SystemExit("a crash recovery was not coherent")
          if any(row.get("evidence") not in ("GENESIS", "CANDIDATE") for row in crashes):
              raise SystemExit("a crash recovery mixed generations")
          PY
          cat "$receipt"
          cat "$native"
          cat "$generation"

  omega-faculty-arm:
    # R10 runs Omega's native AArch64 realizations, so it needs an AArch64 host.
    # The hosted runner is not the DGX Spark: whether an Omega realization beats
    # the reference there is recorded, not required. The chain itself is required.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Checkout pinned Physics headers
        uses: actions/checkout@v4
        with:
          repository: aien-dev/physics
          ref: fecbedb1b9cea9e4de0fa3c88fe795934fb361f9
          path: physics-src
      - name: Read pinned AIENOS authority
        id: aienos
        run: |
          sha=$(awk 'NF && $1 !~ /^#/ {print $1; exit}' aienos.lock)
          test -n "$sha"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - name: Checkout pinned AIENOS authority
        uses: actions/checkout@v4
        with:
          repository: aien-dev/aienos
          ref: ${{ steps.aienos.outputs.sha }}
          path: aienos-src
      - name: Keep dependency checkouts out of Omega tree status
        run: printf 'physics-src/\naienos-src/\n' >> .git/info/exclude
      - name: Program identity binds the canonical semantic body (OMEGA_PROGRAM_ID)
        # AArch64 job: the Visor objects this test links only build on AArch64 hosts
        # (visor_realization.c k_diff_inputs is aarch64-only, pre-existing).
        run: make OUT_DIR=build/pid PHYSICS_DIR=/nonexistent PHYSICS_LOCK_CHECK=0 test-program-id
      - name: Omega as a resident realization faculty (R10)
        env:
          OMEGA_CANDIDATE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
          PHYSICS_DIR: ${{ github.workspace }}/physics-src
          AIENOS_R7_DIR: ${{ github.workspace }}/aienos-src
          AIENOS_COMMIT: ${{ steps.aienos.outputs.sha }}
          R10_ALLOW_NO_WIN: '1'
        run: make test-r10
      - name: Show R10 receipt
        run: |
          receipt="$(find build/qual-runs -name rx_omega_faculty_receipt.json -type f | head -n 1)"
          test -n "$receipt"
          grep -q '"failures": 0,' "$receipt"
          grep -q '"candidate_bound": true,' "$receipt"
          grep -q '"tree_dirty": false,' "$receipt"
          sha256sum "$receipt"
          cat "$receipt"
      - name: AIEN as a resident cognitive faculty (R11)
        env:
          OMEGA_CANDIDATE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
          PHYSICS_DIR: ${{ github.workspace }}/physics-src
          AIENOS_R7_DIR: ${{ github.workspace }}/aienos-src
          AIENOS_COMMIT: ${{ steps.aienos.outputs.sha }}
        run: make test-r11
      - name: Show R11 receipt
        run: |
          receipt="$(find build/qual-runs -name rx_aien_faculty_receipt.json -type f | head -n 1)"
          test -n "$receipt"
          grep -q '"failures": 0,' "$receipt"
          grep -q '"candidate_bound": true,' "$receipt"
          grep -q '"tree_dirty": false,' "$receipt"
          sha256sum "$receipt"
          cat "$receipt"
      - name: R13 living system builds (its run needs both GB10 core classes and the resident seat)
        env:
          PHYSICS_DIR: ${{ github.workspace }}/physics-src
          AIENOS_R7_DIR: ${{ github.workspace }}/aienos-src
        run: make build/rx_r13_living_host
      - name: R14 living recovery builds (its run needs the R13 body, both GB10 core classes and, for the gate, the resident seat)
        env:
          PHYSICS_DIR: ${{ github.workspace }}/physics-src
          AIENOS_R7_DIR: ${{ github.workspace }}/aienos-src
        run: make build/rx_r14_recovery_host
      - name: Plan IR and verified plan cache (OMEGA_PLAN_REUSE; timing criteria are judged on the Spark receipt)
        env:
          OMEGA_CANDIDATE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
          PHYSICS_DIR: ${{ github.workspace }}/physics-src
          AIENOS_R7_DIR: ${{ github.workspace }}/aienos-src
          AIENOS_COMMIT: ${{ steps.aienos.outputs.sha }}
          PLAN_REUSE_NO_ENERGY: '1'
        run: |
          make test-plan-reuse
          receipt="$(find build/qual-runs -name 'rx_plan_reuse_receipt.*.json' -type f | head -n 1)"
          test -n "$receipt"
          grep -q '"failures": 0,' "$receipt"
          grep -q '"G3_outcome_and_evidence": "PASS"' "$receipt"
          grep -q '"G4_false_applicability_zero": "PASS"' "$receipt"
          grep -q '"G5_identity": "PASS"' "$receipt"
          sha256sum "$receipt"
          cat "$receipt"
