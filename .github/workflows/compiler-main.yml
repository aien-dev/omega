name: Compiler on main
# OSC-3 (Lane 30): the `compiler` job in host-suites.yml runs on pull requests
# only. This workflow re-runs the OSC compiler suites after every merge to main
# that touches the compiler paths, so main has its own post-merge result.
# OSC-3 slice; not a general Omega compiler; no self-hosting.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/compiler/**'
      - 'tests/compiler/**'
      - 'mk/compiler.mk'
      - 'src/sha256.*'
      - 'src/aarch64_*'
      - '.github/workflows/compiler-main.yml'
jobs:
  compiler-main:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: OSC compiler quick suite
        run: make PHYSICS_DIR=/nonexistent PHYSICS_LOCK_CHECK=0 test-compiler-quick
      - name: OSC compiler full suite (plain + ASan/UBSan, legacy writer full differential)
        run: make PHYSICS_DIR=/nonexistent PHYSICS_LOCK_CHECK=0 test-compiler-full
